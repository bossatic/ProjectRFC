#===============================================================================
# IDoc Capture Configuration
#===============================================================================

# Output directory where XML files will be saved
# Use forward slashes or double backslashes for Windows paths
output.directory=D:/SapRFC/ProjectRFC/Idocs/captured

# IDoc Documentation folder
# Place downloaded IDoc documentation here, named after IDOCTYP (e.g., ORDERS.doc, INVOIC.doc)
# If documentation exists for a received IDoc, JSON will be generated automatically
idoc.documentation.directory=D:/SapRFC/ProjectRFC/Idocs/documentation

# Documentation auto-reload interval (seconds)
# Background job will scan for new/updated documentation files
# Set to 0 to disable auto-reload
documentation.reload.interval=600

# JSON output directory (only used if documentation exists)
# Leave empty to use same as output.directory
json.output.directory=D:/SapRFC/ProjectRFC/Idocs/captured

# JCo Server Name (must match the .jcoDestination filename prefix)
# E.g., IDOC_SERVER (filename: IDOC_SERVER.jcoDestination)
jco.server.name=IDOC_SERVER

# Repository Destination (client connection for metadata)
# Must match the jco.server.repository_destination in the server config
jco.repository.destination=SAP_SYSTEM

# Enable console logging
logging.enabled=true

# Enable file naming with timestamp
# true: IDOC_[timestamp]_[TID].xml
# false: [TID]_idoc.xml
file.use.timestamp=true

# Enable JSON conversion when documentation exists
# true: Convert to JSON if documentation found
# false: Only write XML
json.conversion.enabled=true

# Enable creation of summary file
summary.file.enabled=true
summary.file.name=idoc_capture_summary.txt

#===============================================================================
# Kafka Configuration
#===============================================================================

# Enable Kafka publishing
kafka.enabled=true


#
 Kafka broker addresses (comma-separated)
kafka.bootstrap.servers=tldqap1.nupco.com:9092

# Topic name prefix for IDoc topics
# Final topic name will be: prefix + IDOC_TYPE (e.g., idoc_ORDERS05)
kafka.topic.prefix=idoc_

# Enable/disable JSON push to Kafka
kafka.push.json=true

# Producer acknowledgement level: all, 1, 0
kafka.acks=all

# Number of retries on failure
kafka.retries=3

# Batch size in bytes
kafka.batch.size=16384

# Linger time in ms
kafka.linger.ms=10
